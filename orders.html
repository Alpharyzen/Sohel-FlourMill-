<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Tracking Order

</title>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;

color:white;

font-family:'Montserrat',sans-serif;

padding:25px;

}

.pageTitle{

font-family:'Cinzel',serif;

font-size:34px;

letter-spacing:3px;

margin-bottom:40px;

}

.sectionTitle{

font-family:'Cinzel',serif;

font-size:24px;

letter-spacing:2px;

margin-bottom:20px;

}

.searchCard{

background:#111;

border:1px solid rgba(255,255,255,.08);

border-radius:25px;

padding:20px;

margin-bottom:35px;

}

.searchInput{

width:100%;

height:55px;

border:none;

outline:none;

background:#1a1a1a;

border-radius:15px;

padding:15px;

color:white;

font-size:16px;

}

.searchBtn{

width:100%;

height:55px;

border:none;

border-radius:15px;

margin-top:12px;

background:white;

color:black;

font-size:17px;

font-weight:700;

cursor:pointer;

}

.orderCounter{

font-size:22px;

margin-bottom:20px;

font-family:'Cinzel',serif;

}

.orderCounter span{

color:#d9d9d9;

}

.currentOrders{

margin-bottom:40px;

}

.previousOrders{

margin-top:50px;

}

.orderContainer{

display:flex;

flex-direction:column;

gap:25px;

}

.orderCard{

background:#f5f5f5;

color:#000;

border-radius:40px;

padding:30px;

position:relative;

overflow:hidden;

}

.cardHeader{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.customerName{

font-size:28px;

font-weight:700;

line-height:1.2;

}

.expandBtn{

width:45px;

height:45px;

border:none;

border-radius:50%;

background:#000;

color:white;

font-size:22px;

cursor:pointer;

}

.cardDetails{

display:none;

margin-top:20px;

}

.infoRow{

margin-bottom:12px;

font-size:16px;

line-height:1.6;

}

.infoLabel{

font-weight:700;

}

.dateTimeRow{

display:flex;

justify-content:space-between;

align-items:center;

margin-top:20px;

margin-bottom:25px;

font-size:15px;

font-weight:600;

}

.tracker{

display:flex;

align-items:center;

justify-content:center;

margin-top:15px;

}

.dot{

width:18px;

height:18px;

border-radius:50%;

background:#cfcfcf;

}

.dot.active{

background:#27c93f;

}

.line{

width:90px;

height:4px;

background:#cfcfcf;

}

.line.active{

background:#27c93f;

}

.truck{

width:58px;

height:58px;

border-radius:50%;

background:#d9d9d9;

display:flex;

align-items:center;

justify-content:center;

font-size:26px;

}

.truck.active{

background:#2196F3;

color:white;

}

.trackerLabels{

display:flex;

justify-content:space-between;

margin-top:15px;

font-size:13px;

font-weight:600;

}
.statusTimes{

display:flex;

justify-content:space-between;

margin-top:15px;

font-size:12px;

text-align:center;

font-weight:600;

}
.cancelBtn{

width:100%;

height:50px;

margin-top:20px;

border:none;

border-radius:15px;

background:#d32f2f;

color:white;

font-size:15px;

font-weight:700;

cursor:pointer;

}

.noOrders{

text-align:center;

color:#bdbdbd;

font-size:18px;

padding:40px 0;

}

@media(max-width:900px){

.pageTitle{

font-size:26px;

}

.customerName{

font-size:22px;

}

.line{

width:55px;

}

.trackerLabels{

font-size:11px;

}

}

</style>

</head>

<body>

<div class="pageTitle">

TRACKING ORDER

</div>

<div class="searchCard">

<input
id="trackPhone"
class="searchInput"
placeholder="Enter Mobile Number">

<button
class="searchBtn"
onclick="loadOrders()">

TRACK ORDER

</button>

</div>

<div class="currentOrders">

<div class="orderCounter">

Current Orders
(<span id="currentCount">0</span>)

</div>

<div
id="currentOrders"
class="orderContainer">

<div class="noOrders">

No Orders Loaded

</div>

</div>

</div>

<div class="previousOrders">

<div class="orderCounter">

Previous Orders
(<span id="previousCount">0</span>)

</div>

<div
id="previousOrders"
class="orderContainer">

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
onSnapshot,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",

authDomain:
"planning-with-ai-90e6a.firebaseapp.com",

projectId:
"planning-with-ai-90e6a",

storageBucket:
"planning-with-ai-90e6a.firebasestorage.app",

messagingSenderId:
"835817978059",

appId:
"1:835817978059:web:441596d86a28628c3fc34e"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.loadOrders =
async function(){

const phone =
document.getElementById(
"trackPhone"
).value.trim();

if(!phone){

alert(
"Enter Mobile Number"
);

return;

}

localStorage.setItem(
"lastPhone",
phone
);

const currentDiv =
document.getElementById(
"currentOrders"
);

const previousDiv =
document.getElementById(
"previousOrders"
);

currentDiv.innerHTML =
'<div class="noOrders">Loading...</div>';

previousDiv.innerHTML =
"";

const snap =
await getDocs(
collection(
db,
"orders"
)
);

const currentOrders=[];
const previousOrders=[];

snap.forEach((d)=>{

const data =
d.data();

if(
data.phone ==
phone
){

if(
data.status=="Delivered"
||
data.status=="Cancelled"
){

previousOrders.push(data);

}else{

currentOrders.push(data);

}

}

});

currentOrders.sort(
(a,b)=>
new Date(b.createdAt)
-
new Date(a.createdAt)
);

previousOrders.sort(
(a,b)=>
new Date(b.createdAt)
-
new Date(a.createdAt)
);

document.getElementById(
"currentCount"
).innerText =
currentOrders.length;

document.getElementById(
"previousCount"
).innerText =
previousOrders.length;

let currentHtml="";
let previousHtml="";

currentOrders.forEach((data,index)=>{

let trackerHtml="";

if(data.status=="Pending"){

trackerHtml=`

<div class="tracker">

<div class="dot active"></div>

<div class="line"></div>

<div class="truck">🚚</div>

<div class="line"></div>

<div class="dot"></div>

</div>

`;

}

else if(data.status=="Confirmed"){

trackerHtml=`

<div class="tracker">

<div class="dot active"></div>

<div class="line active"></div>

<div class="truck active">🚚</div>

<div class="line"></div>

<div class="dot"></div>

</div>

`;

}

else if(data.status=="Out For Delivery"){

trackerHtml=`

<div class="tracker">

<div class="dot active"></div>

<div class="line active"></div>

<div class="truck active">🚚</div>

<div class="line active"></div>

<div class="dot"></div>

</div>

`;

}

else{

trackerHtml=`

<div class="tracker">

<div class="dot active"></div>

<div class="line active"></div>

<div class="truck active">🚚</div>

<div class="line active"></div>

<div class="dot active"></div>

</div>

`;

}

currentHtml -= `

<div class="orderCard">

<div class="cardHeader">

<div>

<div class="customerName">

${data.name}

</div>

<div style="margin-top:6px;">

Customer ID:
${data.orderId}

</div>

</div>

<button
class="expandBtn"
onclick="toggleCard(${index})">

+

</button>

</div>

<div
class="cardDetails"
id="card${index}"

style="display:block;">

<div class="infoRow">

<span class="infoLabel">

Customer ID:

</span>

${data.orderId}

</div>

<div class="infoRow">

<span class="infoLabel">

Mobile:

</span>

${data.phone}

</div>

<div class="infoRow">

<span class="infoLabel">

Address:

</span>

${data.address}

</div>

<div class="dateTimeRow">

<div>

Date:
${new Date(
data.createdAt
).toLocaleDateString()}

</div>

<div>

Time:
${new Date(
data.createdAt
).toLocaleTimeString()}

</div>

</div>

${trackerHtml}

<div class="trackerLabels">

<span>

Confirm

</span>

<span>

Out For Delivery

</span>

<span>

Delivered

</span>

</div>

</div>
`;

if(
data.status=="Pending"
&&
(
(
new Date()
-
new Date(data.createdAt)
)
/
1000
/
60
<5
)
){

currentHtml += `

<button
class="cancelBtn"
onclick="
cancelOrder(
'${data.orderId}'
)
">

Cancel Order

</button>

`;

}

currentHtml += `

</div>

</div>

`;

});

previousOrders.forEach((data)=>{

previousHtml += `

<div class="orderCard">

<div class="customerName">

${data.name}

</div>

<div class="infoRow">

<span class="infoLabel">

Customer ID:

</span>

${data.orderId}

</div>

<div class="infoRow">

<span class="infoLabel">

Mobile:

</span>

${data.phone}

</div>

<div class="infoRow">

<span class="infoLabel">

Address:

</span>

${data.address}

</div>

<div class="dateTimeRow">

<div>

Date:
${new Date(
data.createdAt
).toLocaleDateString()}

</div>

<div>

Time:
${new Date(
data.createdAt
).toLocaleTimeString()}

</div>

</div>

<div class="tracker">

<div class="dot active"></div>

<div class="line active"></div>

<div class="truck active">

🚚

</div>

<div class="line active"></div>

<div class="dot active"></div>

</div>

<div class="trackerLabels">

<span>Confirm</span>

<span>Out For Delivery</span>

<span>Delivered</span>

</div>

<div
style="
margin-top:15px;
text-align:center;
font-size:14px;
">

Delivered:
${data.deliveredAt || "-"}

</div>

</div>

`;

});

if(
currentOrders.length==0
){

currentDiv.innerHTML =

'<div class="noOrders">No Current Orders</div>';

}else{

currentDiv.innerHTML =
currentHtml;

}

if(
previousOrders.length==0
){

previousDiv.innerHTML =

'<div class="noOrders">No Previous Orders</div>';

}else{

previousDiv.innerHTML =
previousHtml;

}

};

window.toggleCard =
function(index){

const card =
document.getElementById(
"card"+index
);

if(
card.style.display==
"block"
){

card.style.display=
"none";

}else{

card.style.display=
"block";

}

};

window.cancelOrder =
async function(orderId){

const snap =
await getDocs(
collection(
db,
"orders"
)
);

for(
const d
of
snap.docs
){

const data =
d.data();

if(
data.orderId==
orderId
){

await updateDoc(

doc(
db,
"orders",
d.id
),

{

status:
"Cancelled",

cancelled:true

}

);

alert(
"Order Cancelled"
);

break;

}

}

};

window.onload =
function(){

const phone =
localStorage.getItem(
"lastPhone"
);

if(phone){

document.getElementById(
"trackPhone"
).value =
phone;

loadOrders();

}

onSnapshot(

collection(
db,
"orders"
),

()=>{

const savedPhone =
localStorage.getItem(
"lastPhone"
);

if(savedPhone){

document.getElementById(
"trackPhone"
).value =
savedPhone;

loadOrders();

}

}

);

};

</script>

</body>

</html>
