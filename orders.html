<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
My Orders
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
padding:15px;
}

.header{
background:#8B4513;
color:white;
padding:15px;
border-radius:12px;
text-align:center;
margin-bottom:20px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-top:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#8B4513;
color:white;
margin-top:10px;
cursor:pointer;
}

.status{
font-weight:bold;
margin-top:10px;
}

.pending{
color:#ff9800;
}

.confirmed{
color:#4CAF50;
}

.delivery{
color:#2196F3;
}

.delivered{
color:#009688;
}

</style>

</head>

<body>

<div class="header">

<h2>
📦 My Orders
</h2>

</div>

<div class="card">

<input
id="trackPhone"
placeholder="Enter Mobile Number">

<button
onclick="loadOrders()">

View Orders

</button>

</div>

<div id="orders">

No Orders Loaded

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",

authDomain:
"planning-with-ai-90e6a.firebaseapp.com",

projectId:
"planning-with-ai-90e6a",

storageBucket:
"planning-with-ai-90e6a.firebasestorage.app",

messagingSenderId:
"835817978059",

appId:
"1:835817978059:web:441596d86a28628c3fc34e"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.loadOrders =
async function(){

const phone =
document.getElementById(
"trackPhone"
).value;

if(!phone){

alert(
"Enter Mobile Number"
);

return;

}

localStorage.setItem(
"lastPhone",
phone
);

const ordersDiv =
document.getElementById(
"orders"
);

ordersDiv.innerHTML =
"Loading Orders...";

const snap =
await getDocs(
collection(
db,
"orders"
)
);

const orders=[];

snap.forEach((d)=>{

const data=d.data();

if(
data.phone==phone
){

orders.push(data);

}

});

orders.sort(
(a,b)=>
new Date(b.createdAt) -
new Date(a.createdAt)
);

let html="";

if(
orders.length==0
){

ordersDiv.innerHTML =
"No Orders Found";

return;

}

orders.forEach((data)=>{

let statusClass =
"pending";

let emoji =
"🟡";

if(
data.status==
"Confirmed"
){

statusClass=
"confirmed";

emoji="🟢";

}

if(
data.status==
"Out For Delivery"
){

statusClass=
"delivery";

emoji="🔵";

}

if(
data.status==
"Delivered"
){

statusClass=
"delivered";

emoji="✅";

}

html += `

<div class="card">

<h3>

${emoji}
Order ID:
${data.orderId}

</h3>

<p>

📅
${new Date(
data.createdAt
).toLocaleDateString()}

<br>

⏰
${new Date(
data.createdAt
).toLocaleTimeString()}

</p>

<div
style="
background:#fafafa;
padding:10px;
border-radius:8px;
margin-top:10px;
">

<b>
Products:
</b>

<ul>

${(data.items || []).map(item => `

<li>

${item.product}
-
${item.qty} KG

</li>

`).join("")}

</ul>

</div>

<p>

⚖ Total KG:
${data.totalKg || 0}

</p>

<p>

💰 Total:
₹${data.totalAmount || 0}

</p>

<div
class="
status
${statusClass}
">

${emoji}
${data.status}

</div>

</div>

`;

});

ordersDiv.innerHTML =
html;

};

window.onload =
function(){

const phone =
localStorage.getItem(
"lastPhone"
);

if(phone){

document.getElementById(
"trackPhone"
).value =
phone;

loadOrders();

}

onSnapshot(

collection(
db,
"orders"
),

()=>{

const savedPhone =
localStorage.getItem(
"lastPhone"
);

if(savedPhone){

document.getElementById(
"trackPhone"
).value =
savedPhone;

loadOrders();

}

}

);

};

</script>

</body>
</html>
