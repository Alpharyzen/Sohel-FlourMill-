<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Place Order

</title>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{

background:#000;
color:#fff;

padding:20px;

}

/* HEADER */

.header{

text-align:center;

padding:30px 15px;

margin-bottom:25px;

}

.header h1{

font-family:'Cinzel',serif;

font-size:30px;

letter-spacing:3px;

}

.header p{

margin-top:10px;

color:#cfcfcf;

font-size:14px;

}

/* PRODUCT CARD */

.productCard{

background:#111;

border:1px solid rgba(255,255,255,.08);

border-radius:20px;

padding:15px;

margin-bottom:15px;

display:flex;

align-items:center;

justify-content:space-between;

}

.productLeft{

display:flex;

align-items:center;

gap:15px;

}

.productImg{

width:70px;

height:70px;

border-radius:15px;

object-fit:cover;

}

.productName{

font-size:18px;

font-weight:700;

}

.qtyBox{

display:flex;

align-items:center;

gap:10px;

}

.qtyBtn{

width:38px;

height:38px;

border:none;

border-radius:50%;

background:#8B4513;

color:white;

font-size:20px;

cursor:pointer;

}

.qtyValue{

width:35px;

text-align:center;

font-size:18px;

font-weight:700;

}
.totalCard{

background:#111;

border:1px solid rgba(255,255,255,.08);

border-radius:20px;

padding:20px;

margin-top:20px;

text-align:center;

}

.totalCard h3{

font-size:22px;

margin-bottom:12px;

}

.totalText{

font-size:18px;

margin:10px 0;

color:#ddd;

}

.continueBtn{

width:100%;

height:55px;

border:none;

border-radius:15px;

background:#8B4513;

color:white;

font-size:18px;

font-weight:700;

margin-top:15px;

cursor:pointer;

}

.detailsSection{

display:none;

margin-top:25px;

}

</style>

</head>

<body>

<div class="header">

<h1>

SHADAB FLOUR MILL

</h1>

<p>

Select Products To Continue

</p>

</div>

<!-- WHEAT -->

<div class="productCard">

<div class="productLeft">

<img
src="images/wheat.jpg"
class="productImg">

<div class="productName">

WHEAT

</div>

</div>

<div class="qtyBox">

<button
class="qtyBtn"
onclick="changeQty('wheat',-1)">

-

</button>

<div
class="qtyValue"
id="wheatQty">

0

</div>

<button
class="qtyBtn"
onclick="changeQty('wheat',1)">

+

</button>

</div>

</div>

<!-- JAWARI -->

<div class="productCard">

<div class="productLeft">

<img
src="images/jawari.jpg"
class="productImg">

<div class="productName">

JAWARI

</div>

</div>

<div class="qtyBox">

<button
class="qtyBtn"
onclick="changeQty('jawari',-1)">

-

</button>

<div
class="qtyValue"
id="jawariQty">

0

</div>

<button
class="qtyBtn"
onclick="changeQty('jawari',1)">

+

</button>

</div>

</div>

<!-- BAJRA -->

<div class="productCard">

<div class="productLeft">

<img
src="images/bajra.jpg"
class="productImg">

<div class="productName">

BAJRA

</div>

</div>

<div class="qtyBox">

<button
class="qtyBtn"
onclick="changeQty('bajra',-1)">

-

</button>

<div
class="qtyValue"
id="bajraQty">

0

</div>

<button
class="qtyBtn"
onclick="changeQty('bajra',1)">

+

</button>

</div>

</div>

<!-- BESAN -->

<div class="productCard">

<div class="productLeft">

<img
src="images/besan.jpg"
class="productImg">

<div class="productName">

BESAN

</div>

</div>

<div class="qtyBox">

<button
class="qtyBtn"
onclick="changeQty('besan',-1)">

-

</button>

<div
class="qtyValue"
id="besanQty">

0

</div>

<button
class="qtyBtn"
onclick="changeQty('besan',1)">

+

</button>

</div>

</div>

<!-- TOTAL -->

<div class="totalCard">

<h3>

ORDER SUMMARY

</h3>

<div
class="totalText">

Total KG:
<span id="totalKg">

0

</span>

</div>

<div
class="totalText">

Estimated Amount:
₹<span id="totalAmount">

0

</span>

</div>

<button
class="continueBtn"
onclick="showDetails()">

CONTINUE

</button>

</div>

<!-- CUSTOMER DETAILS -->

<div
class="detailsSection"
id="detailsSection">

<div
style="
background:#111;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:20px;
margin-top:20px;
">

<h2
style="
margin-bottom:20px;
text-align:center;
">

CUSTOMER DETAILS

</h2>

<input
id="customerName"
placeholder="Full Name"

style="
width:100%;
padding:15px;
border:none;
border-radius:12px;
margin-bottom:15px;
background:#1b1b1b;
color:white;
">

<input
id="customerPhone"
placeholder="Mobile Number"

style="
width:100%;
padding:15px;
border:none;
border-radius:12px;
margin-bottom:15px;
background:#1b1b1b;
color:white;
">

<textarea
id="customerAddress"
placeholder="Full Address"

style="
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:12px;
background:#1b1b1b;
color:white;
resize:none;
">

</textarea>

<button
id="placeOrderBtn"

style="
width:100%;
height:60px;
margin-top:20px;
border:none;
border-radius:15px;
background:#8B4513;
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
">

PLACE ORDER

</button>

</div>

</div>

<script>

const prices={

wheat:40,
jawari:60,
bajra:55,
besan:80

};

const qty={

wheat:0,
jawari:0,
bajra:0,
besan:0

};

function changeQty(product,value){

qty[product]+=value;

if(qty[product]<0){

qty[product]=0;

}

document.getElementById(
product+"Qty"
).innerText=
qty[product];

calculateTotal();

}

function calculateTotal(){

let totalKg=0;

let totalAmount=0;

for(
let p in qty
){

totalKg+=qty[p];

totalAmount+=
qty[p]*
prices[p];

}

document.getElementById(
"totalKg"
).innerText=
totalKg;

document.getElementById(
"totalAmount"
).innerText=
totalAmount;

}

function showDetails(){

const totalKg=
parseInt(
document.getElementById(
"totalKg"
).innerText
);

if(totalKg<=0){

alert(
"Select Products First"
);

return;

}

document.getElementById(
"detailsSection"
).style.display=
"block";

window.scrollTo({

top:
document.body.scrollHeight,

behavior:
"smooth"

});

}

</script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",

authDomain:
"planning-with-ai-90e6a.firebaseapp.com",

projectId:
"planning-with-ai-90e6a",

storageBucket:
"planning-with-ai-90e6a.firebasestorage.app",

messagingSenderId:
"835817978059",

appId:
"1:835817978059:web:441596d86a28628c3fc34e"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

function generateOrderId(){

return "SFM" +
Date.now()
.toString()
.slice(-8);

}

document
.getElementById(
"placeOrderBtn"
)

.addEventListener(

"click",

async ()=>{

const name =
document.getElementById(
"customerName"
).value.trim();

const phone =
document.getElementById(
"customerPhone"
).value.trim();

const address =
document.getElementById(
"customerAddress"
).value.trim();

if(
!name ||
!phone ||
!address
){

alert(
"Please Fill All Details"
);

return;

}

const items=[];

if(qty.wheat>0){

items.push({

product:"Wheat",
qty:qty.wheat

});

}

if(qty.jawari>0){

items.push({

product:"Jawari",
qty:qty.jawari

});

}

if(qty.bajra>0){

items.push({

product:"Bajra",
qty:qty.bajra

});

}

if(qty.besan>0){

items.push({

product:"Besan",
qty:qty.besan

});

}

const totalKg =
parseInt(
document.getElementById(
"totalKg"
).innerText
);

const totalAmount =
parseInt(
document.getElementById(
"totalAmount"
).innerText
);

const orderId =
generateOrderId();

try{

await addDoc(

collection(
db,
"orders"
),

{

orderId,

name,

phone,

address,

items,

totalKg,

totalAmount,

status:"Pending",

createdAt:
new Date()
.toISOString()

}

);

alert(

"✅ Order Placed Successfully\n\nOrder ID: "
+
orderId

);

window.location.href =
"orders.html";

}

catch(e){

console.error(e);

alert(
"Failed To Place Order"
);

}

}

);

</script>

</body>

</html>
