<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Delivery History

</title>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;

color:white;

font-family:'Montserrat',sans-serif;

}

/* HEADER */

.hero{

height:280px;

background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.45)
),

url(
'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?q=80&w=1200'
);

background-size:cover;
background-position:center;

padding:25px;

display:flex;

flex-direction:column;

justify-content:space-between;

}

.backBtn{

width:130px;

height:50px;

border:none;

border-radius:25px;

background:white;

font-size:18px;

font-weight:700;

cursor:pointer;

}

.heroCenter{

text-align:center;

margin-bottom:20px;

}

.heroTitle{

font-family:'Cinzel',serif;

font-size:60px;

letter-spacing:2px;

}

.heroSub{

font-size:18px;

margin-top:10px;

color:#ddd;

}

/* CONTAINER */

.container{

padding:20px;

}

/* SUMMARY */

.summaryGrid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:12px;

margin-bottom:25px;

}

.summaryCard{

background:#111;

border-radius:20px;

padding:18px;

text-align:center;

}

.summaryNumber{

font-size:28px;

font-weight:800;

}

.summaryLabel{

font-size:12px;

color:#aaa;

margin-top:6px;

}

.revenue{
border-left:4px solid #4CAF50;
}

.delivered{
border-left:4px solid #2196F3;
}

.cancelled{
border-left:4px solid #F44336;
}

/* DATE SELECTOR */

.dateTabs{

display:flex;

gap:12px;

overflow-x:auto;

padding:10px 0 20px;

margin-bottom:20px;

scrollbar-width:none;

}

.dateTabs::-webkit-scrollbar{

display:none;

}

.dayCard{

min-width:70px;

text-align:center;

cursor:pointer;

}

.dayName{

font-size:13px;

color:#999;

margin-bottom:8px;

}

.dateCircle{

width:60px;

height:60px;

border-radius:50%;

background:#111;

border:2px solid #222;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

font-weight:700;

margin:auto;

transition:.25s;

}

.dayCard.active .dateCircle{

background:#f44336;

border-color:#f44336;

color:white;

box-shadow:0 4px 15px rgba(244,67,54,.4);

}

.dayCard.active .dayName{

color:#f44336;

font-weight:700;

}

/* DATE TITLE */

.selectedDate{

font-size:22px;

font-weight:800;

margin-bottom:20px;

color:white;

}

/* HISTORY CARD */

.historyCard{

background:#f5f5f5;

color:#000;

border-radius:35px;

padding:25px;

margin-bottom:18px;

}

.customerName{

font-size:24px;

font-weight:800;

margin-bottom:15px;

}

.infoRow{

margin-bottom:12px;

line-height:1.6;

word-break:break-word;

}

.label{

font-weight:700;

}

/* PRODUCT BOX */

.productBox{

margin-top:12px;

padding:15px;

background:#ececec;

border-radius:16px;

}

.productTitle{

font-weight:800;

margin-bottom:10px;

}

.productItem{

margin-bottom:6px;

}

/* DELIVERED BADGE */

.deliveredBadge{

margin-top:20px;

display:inline-block;

padding:12px 22px;

background:#1dbf3a;

color:white;

border-radius:25px;

font-weight:800;

}

/* EMPTY */

.noOrders{

background:#111;

border-radius:20px;

padding:30px;

text-align:center;

color:#999;

}

/* MOBILE */

@media(max-width:900px){

.hero{

height:240px;

}

.heroTitle{

font-size:44px;

}

.summaryGrid{

grid-template-columns:1fr;

}

.customerName{

font-size:20px;

}

.dateCircle{

width:55px;

height:55px;

}

}

</style>

</head>

<body>

<div class="hero">

<button
class="backBtn"
onclick="
location.href=
'admin_v2.html'
">

← Orders

</button>

<div class="heroCenter">

<div class="heroTitle">

HISTORY

</div>

<div class="heroSub">

History Of Last 7 Days

</div>

</div>

</div>

<div class="container">

<div class="summaryGrid">

<div
class="
summaryCard
revenue
">

<div
id="revenueTotal"
class="summaryNumber">

₹0

</div>

<div class="summaryLabel">

Revenue

</div>

</div>

<div
class="
summaryCard
delivered
">

<div
id="deliveredTotal"
class="summaryNumber">

0

</div>

<div class="summaryLabel">

Delivered

</div>

</div>

<div
class="
summaryCard
cancelled
">

<div
id="cancelledTotal"
class="summaryNumber">

0

</div>

<div class="summaryLabel">

Cancelled

</div>

</div>

</div>

<div
id="dateTabs"
class="dateTabs">

</div>

<div
id="selectedDate"
class="selectedDate">

Loading...

</div>

<div
id="historyContainer">

<div class="noOrders">

Loading History...

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",

authDomain:
"planning-with-ai-90e6a.firebaseapp.com",

projectId:
"planning-with-ai-90e6a",

storageBucket:
"planning-with-ai-90e6a.firebasestorage.app",

messagingSenderId:
"835817978059",

appId:
"1:835817978059:web:441596d86a28628c3fc34e"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const weekData={};

const days=[
"Sun",
"Mon",
"Tue",
"Wed",
"Thu",
"Fri",
"Sat"
];

async function loadHistory(){

const snap =
await getDocs(
collection(
db,
"orders"
)
);

let totalRevenue=0;
let totalDelivered=0;
let totalCancelled=0;

/* LAST 7 DAYS */

for(
let i=0;
i<7;
i++
){

const d=
new Date();

d.setDate(
d.getDate()-i
);

const date=
d.toLocaleDateString();

weekData[date]=[];

}

snap.forEach((doc)=>{

const data=
doc.data();

/* DELIVERED */

if(
data.status=="Delivered"
&&
data.deliveredAt
){

const date=
new Date(
data.deliveredAt
)
.toLocaleDateString();

if(
weekData[date]
){

weekData[date]
.push(data);

}

totalRevenue +=
Number(
data.totalAmount
||
0
);

totalDelivered++;

}

/* CANCELLED */

if(
data.status=="Cancelled"
){

totalCancelled++;

}

});

document
.getElementById(
"revenueTotal"
)
.innerText=

"₹"+
totalRevenue;

document
.getElementById(
"deliveredTotal"
)
.innerText=
totalDelivered;

document
.getElementById(
"cancelledTotal"
)
.innerText=
totalCancelled;

generateDateTabs();

}

function generateDateTabs(){

const tabs=
document.getElementById(
"dateTabs"
);

tabs.innerHTML="";

for(
let i=6;
i>=0;
i--
){

const d=
new Date();

d.setDate(
d.getDate()-i
);

const date=
d.toLocaleDateString();

tabs.innerHTML += `

<div
class="dayCard"
onclick="
showHistoryDate(
this,
'${date}'
)
">

<div class="dayName">

${days[
d.getDay()
]}

</div>

<div class="dateCircle">

${d.getDate()}

</div>

</div>

`;

}

setTimeout(()=>{

const latest=

document.querySelectorAll(
".dayCard"
);

if(
latest.length
){

latest[
latest.length-1
].click();

}

},300);

}

window.showHistoryDate =
function(
element,
date
){

document
.querySelectorAll(
".dayCard"
)
.forEach(card=>{

card.classList.remove(
"active"
);

});

element.classList.add(
"active"
);

document
.getElementById(
"selectedDate"
)
.innerHTML=

"📅 " + date;

const container=

document.getElementById(
"historyContainer"
);

container.innerHTML="";

const orders=

weekData[
date
] || [];

if(
orders.length==0
){

container.innerHTML=

`

<div class="noOrders">

❌ No Orders Found

</div>

`;

return;

}

/* NEWEST FIRST */

orders.sort(
(a,b)=>
new Date(
b.deliveredAt
)
-
new Date(
a.deliveredAt
)
);

orders.forEach((o)=>{

container.innerHTML += `

<div class="historyCard">

<div class="customerName">

${o.name ||
o.customerName ||
"Customer"}

</div>

<div class="infoRow">

<span class="label">

📞 Phone:

</span>

${o.phone || "-"}

</div>

<div class="infoRow">

<span class="label">

📍 Address:

</span>

${o.address || "-"}

</div>

<div class="infoRow">

<span class="label">

⚖ Total KG:

</span>

${o.totalKg || 0}

</div>

<div class="infoRow">

<span class="label">

💰 Amount:

</span>

₹${o.totalAmount || 0}

</div>

<div class="productBox">

<div class="productTitle">

📦 Products

</div>

${(o.items || [])
.map(item => `

<div class="productItem">

• ${item.product}
- ${item.qty} KG

</div>

`)
.join("")}

</div>

<div
class="deliveredBadge">

✅ DELIVERED

</div>

<div
style="
margin-top:15px;
font-size:14px;
color:#666;
">

🕒

${new Date(
o.deliveredAt
).toLocaleTimeString()}

</div>

</div>

`;

});

};

loadHistory();

/* AUTO REFRESH EVERY 30 SEC */

setInterval(
()=>{

loadHistory();

},
30000

);

</script>

</body>

</html>
