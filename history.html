<div class="topBar">

<button
class="backBtn"
onclick="location.href='admin_v2.html'">

← Orders

</button>

<h1>
📜 Delivery History
</h1>

</div>

<div class="card">

<h2>
📊 Last 7 Days Summary
</h2>

<div id="weekSummary">

Loading...

</div>

</div>

<div
id="dateTabs"
class="dateTabs">
</div>

<div
id="selectedDateTitle"
style="
font-size:20px;
font-weight:bold;
margin-bottom:15px;
color:#8B4513;
">
</div>

<div id="history">

Loading History...

</div>

<style>

.dateTabs{
display:flex;
gap:12px;
overflow-x:auto;
padding:15px 0;
margin-bottom:15px;
}

.dayCard{
text-align:center;
min-width:65px;
cursor:pointer;
}

.dayName{
font-size:14px;
color:#666;
margin-bottom:8px;
}

.dateCircle{
width:55px;
height:55px;
border-radius:50%;
border:2px solid #ddd;
display:flex;
align-items:center;
justify-content:center;
background:white;
font-size:18px;
margin:auto;
}

.active .dateCircle{
background:#f44336;
color:white;
border:none;
font-weight:bold;
box-shadow:0 2px 10px rgba(244,67,54,.4);
}

.active .dayName{
color:#f44336;
font-weight:bold;
}

.orderItem{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.noHistory{
background:white;
padding:20px;
text-align:center;
border-radius:10px;
color:#888;
}

.revenueCard{
background:#4CAF50;
color:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

</style>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",
authDomain: "planning-with-ai-90e6a.firebaseapp.com",
projectId: "planning-with-ai-90e6a",
storageBucket: "planning-with-ai-90e6a.firebasestorage.app",
messagingSenderId: "835817978059",
appId: "1:835817978059:web:441596d86a28628c3fc34e"
};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const weekData = {};

const days =
["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

async function loadHistory(){

const snap =
await getDocs(
collection(
db,
"orders"
)
);

let totalRevenue = 0;
let totalDeliveries = 0;

for(let i=0;i<7;i++){

const d =
new Date();

d.setDate(
d.getDate()-i
);

const date =
d.toLocaleDateString();

weekData[date] = [];

}

snap.forEach((doc)=>{

const data =
doc.data();

if(
data.status!="Delivered"
){
return;
}

if(
!data.deliveredAt
){
return;
}

const date =
new Date(
data.deliveredAt
).toLocaleDateString();

if(
weekData[date]
){

weekData[date]
.push(data);

totalRevenue +=
Number(
data.totalAmount || 0
);

totalDeliveries++;

}

});

document
.getElementById(
"weekSummary"
)
.innerHTML =

`
<div class="revenueCard">

💰 Revenue

<br><br>

₹${totalRevenue}

<br><br>

📦 Deliveries

${totalDeliveries}

</div>
`;

generateDateTabs();

}

function generateDateTabs(){

const tabs =
document.getElementById(
"dateTabs"
);

tabs.innerHTML="";

for(let i=6;i>=0;i--){

const d =
new Date();

d.setDate(
d.getDate()-i
);

const date =
d.toLocaleDateString();

tabs.innerHTML += `

<div
class="dayCard"
onclick="
showHistoryDate(
this,
'${date}'
)
">

<div class="dayName">

${days[d.getDay()]}

</div>

<div class="dateCircle">

${d.getDate()}

</div>

</div>

`;

}

setTimeout(()=>{

const first =
document.querySelector(
".dayCard:last-child"
);

if(first){

first.click();

}

},300);

}

window.showHistoryDate =
function(el,date){

document
.querySelectorAll(
".dayCard"
)
.forEach(x=>
x.classList.remove(
"active"
)
);

el.classList.add(
"active"
);

document
.getElementById(
"selectedDateTitle"
)
.innerHTML =

"📅 " + date;

const history =
document.getElementById(
"history"
);

history.innerHTML="";

const orders =
weekData[date] || [];

if(
orders.length==0
){

history.innerHTML =

`
<div class="noHistory">

❌ No Order History

</div>
`;

return;

}

orders.forEach((o)=>{

history.innerHTML += `

<div class="orderItem">

👤
${o.customerName}

<br><br>

📍
${o.address}

<br><br>

📦 Products

<br><br>

${(o.items || []).map(i => `
• ${i.product}
 - ${i.qty} KG
<br>
`).join("")}

<br>

💰 ₹${o.totalAmount}

<br><br>

⏰
${new Date(
o.deliveredAt
).toLocaleTimeString()}

</div>

`;

});

};

loadHistory();

</script>

</body>
</html>
