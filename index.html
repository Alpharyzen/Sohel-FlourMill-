<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadab Flour Mill</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}
header{
background:#8B4513;
color:#fff;
padding:20px;
text-align:center;
}
.card{
background:#fff;
margin:15px;
padding:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
}
input,select,button{
width:100%;
padding:12px;
margin-top:10px;
box-sizing:border-box;
}
button{
background:#8B4513;
color:white;
border:none;
border-radius:5px;
}
</style>
</head>
<body>

<header>
<h1>🌾 Shadab Flour Mill</h1>
<p>Kondhwa, Pune</p>
</header>

<div class="card">
<h2>Products</h2>

<select id="product">
<option>Wheat Flour</option>
<option>Jowar Flour</option>
<option>Bajra Flour</option>
<option>Besan</option>
</select>

<input type="number" id="kg" placeholder="Quantity (KG)">

<input type="text" id="name" placeholder="Customer Name">

<input type="tel" id="phone" placeholder="Mobile Number">

<input type="text" id="address" placeholder="Delivery Address">

<button onclick="calc()">Calculate Amount</button>

<h3 id="total"></h3>

<button onclick="alert('Order feature next step me add karenge')">
Place COD Order
</button>
</div>

<script>
function calc(){
let kg=parseFloat(document.getElementById("kg").value)||0;
let total=kg*50;
document.getElementById("total").innerHTML=
"Total Amount: ₹"+total;
}
</script>

</body>
</html>
