<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadab Flour Mill</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#8B4513;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:800px;
margin:20px auto;
padding:15px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.product{
padding:10px;
border-bottom:1px solid #ddd;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#8B4513;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.total{
font-size:22px;
font-weight:bold;
margin-top:15px;
color:green;
text-align:center;
}

.footer{
text-align:center;
padding:20px;
color:#666;
}
</style>
</head>

<body>

<header>
<h1>🌾 Shadab Flour Mill</h1>
<p>Kondhwa, Pune</p>
<p>Cash On Delivery Available</p>
</header>

<div class="container">

<div class="card">
<h2>Available Products</h2>

<div class="product">🌾 Wheat Flour - ₹50/KG</div>
<div class="product">🌽 Jowar Flour - ₹50/KG</div>
<div class="product">🌾 Bajra Flour - ₹50/KG</div>
<div class="product">🟡 Besan - ₹50/KG</div>

</div>

<div class="card">

<h2>Place Order</h2>

<select id="product">
<option>Wheat Flour</option>
<option>Jowar Flour</option>
<option>Bajra Flour</option>
<option>Besan</option>
</select>

<input type="number" id="kg" placeholder="Quantity in KG">

<input type="text" id="name" placeholder="Customer Name">

<input type="tel" id="phone" placeholder="Mobile Number">

<input type="text" id="address" placeholder="Delivery Address">

<button onclick="calculateTotal()">
Calculate Amount
</button>

<div class="total" id="total">
Total Amount: ₹0
</div>

<button onclick="placeOrder()">
Place COD Order
</button>

</div>

<div class="card">
<h2>Contact Us</h2>

<p>📍 Kondhwa, Pune</p>
<p>📞 8459925150</p>

<a href="https://wa.me/918459925150" target="_blank">
<button>
Order on WhatsApp
</button>
</a>

</div>

</div>

<div class="footer">
© 2026 Shadab Flour Mill
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",
  authDomain: "planning-with-ai-90e6a.firebaseapp.com",
  projectId: "planning-with-ai-90e6a",
  storageBucket: "planning-with-ai-90e6a.firebasestorage.app",
  messagingSenderId: "835817978059",
  appId: "1:835817978059:web:441596d86a28628c3fc34e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.calculateTotal = function(){

let kg =
parseFloat(document.getElementById("kg").value) || 0;

let total = kg * 50;

document.getElementById("total").innerHTML =
"Total Amount: ₹" + total;

}

window.placeOrder = async function(){

let product =
document.getElementById("product").value;

let kg =
document.getElementById("kg").value;

let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let address =
document.getElementById("address").value;

if(!name || !phone || !address || !kg){
alert("Please fill all details");
return;
}

let total = Number(kg) * 50;

try{

const orderId = "ORD" + Date.now();

await addDoc(collection(db,"orders"),{
orderId:orderId,
customerName:name,
phone:phone,
address:address,
product:product,
quantityKg:Number(kg),
totalAmount:total,
paymentMethod:"COD",
status:"Pending",
createdAt:new Date().toISOString()
});

let message =
"🌾 Shadab Flour Mill Order%0A%0A" +
"Order ID: " + orderId + "%0A" +
"Name: " + name + "%0A" +
"Phone: " + phone + "%0A" +
"Product: " + product + "%0A" +
"Quantity: " + kg + " KG%0A" +
"Address: " + address + "%0A" +
"Total: ₹" + total + "%0A" +
"Payment: Cash On Delivery";

window.open(
"https://wa.me/918459925150?text=" + message,
"_blank"
);

alert(
"Order Saved Successfully!\n\nOrder ID: " +
orderId +
"\n\nSave this Order ID for tracking."
);

}catch(e){

console.error(e);
alert("Firebase Error: " + e.message);

}

}

</script>

</body>
</html>
