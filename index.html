<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",
  authDomain: "planning-with-ai-90e6a.firebaseapp.com",
  projectId: "planning-with-ai-90e6a",
  storageBucket: "planning-with-ai-90e6a.firebasestorage.app",
  messagingSenderId: "835817978059",
  appId: "1:835817978059:web:441596d86a28628c3fc34e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.calculateTotal = function () {

let kg =
parseFloat(document.getElementById("kg").value) || 0;

let total = kg * 50;

document.getElementById("total").innerHTML =
"Total Amount: ₹" + total;

}

window.placeOrder = async function () {

let product =
document.getElementById("product").value;

let kg =
document.getElementById("kg").value;

let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let address =
document.getElementById("address").value;

if(!name || !phone || !address || !kg){
alert("Please fill all details");
return;
}

let total = Number(kg) * 50;

try {

await addDoc(collection(db, "orders"), {
customerName: name,
phone: phone,
address: address,
product: product,
quantityKg: Number(kg),
totalAmount: total,
paymentMethod: "COD",
status: "Pending",
createdAt: new Date().toISOString()
});

let message =
"🌾 Shadab Flour Mill Order%0A%0A" +
"Name: " + name + "%0A" +
"Phone: " + phone + "%0A" +
"Product: " + product + "%0A" +
"Quantity: " + kg + " KG%0A" +
"Address: " + address + "%0A" +
"Total: ₹" + total + "%0A" +
"Payment: Cash On Delivery";

window.open(
"https://wa.me/918459925150?text=" + message,
"_blank"
);

alert("Order Saved Successfully!");

} catch(e) {

console.error(e);
alert("Firebase Error: " + e.message);

}

}

</script>
