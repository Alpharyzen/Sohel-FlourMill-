<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Shadab Flour Mill
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#8B4513;
color:white;
text-align:center;
padding:20px;
}

header h1{
font-size:32px;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h2{
margin-bottom:15px;
color:#8B4513;
}

.product{
padding:12px;
border-bottom:1px solid #ddd;
}

.product:last-child{
border:none;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#8B4513;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.total{
font-size:22px;
font-weight:bold;
margin-top:15px;
color:green;
text-align:center;
}

.footer{
text-align:center;
padding:20px;
color:#666;
}

.qty{
width:100%;
}

</style>

</head>

<body>

<header>

<h1>
🌾 Shadab Flour Mill
</h1>

<p>
Kondhwa, Pune
</p>

<p>
Cash On Delivery Available
</p>

</header>

<div class="container">

<div class="card">

<h2>
Available Products
</h2>

<div class="product">

🌾 Wheat Flour - ₹50/KG

<input
type="number"
id="wheat"
class="qty"
placeholder="Wheat KG">

</div>

<div class="product">

🌽 Jowar Flour - ₹50/KG

<input
type="number"
id="jowar"
class="qty"
placeholder="Jowar KG">

</div>

<div class="product">

🌾 Bajra Flour - ₹50/KG

<input
type="number"
id="bajra"
class="qty"
placeholder="Bajra KG">

</div>

<div class="product">

🟡 Besan - ₹50/KG

<input
type="number"
id="besan"
class="qty"
placeholder="Besan KG">

</div>

</div>

<div class="card">

<h2>
Place Order
</h2>

<input
type="text"
id="name"
placeholder="Customer Name">

<input
type="tel"
id="phone"
placeholder="Mobile Number">

<input
type="text"
id="address"
placeholder="Delivery Address">

<button
onclick="calculateTotal()">

Calculate Amount

</button>

<div
class="total"
id="total">

Total Amount: ₹0

</div>

<button
onclick="placeOrder()">

Place COD Order

</button>

<button
onclick="location.href='orders.html'">

📦 View My Orders

</button>

</div>

<div class="card">

<h2>
Contact Us
</h2>

<p>
📍 Kondhwa, Pune
</p>

<p>
📞 8459925150
</p>

<a
href="https://wa.me/918459925150"
target="_blank">

<button>

Order on WhatsApp

</button>

</a>

</div>

</div>

<div class="footer">

© 2026 Shadab Flour Mill

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",

authDomain:
"planning-with-ai-90e6a.firebaseapp.com",

projectId:
"planning-with-ai-90e6a",

storageBucket:
"planning-with-ai-90e6a.firebasestorage.app",

messagingSenderId:
"835817978059",

appId:
"1:835817978059:web:441596d86a28628c3fc34e"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.calculateTotal = function(){

let wheat =
Number(
document.getElementById("wheat").value
) || 0;

let jowar =
Number(
document.getElementById("jowar").value
) || 0;

let bajra =
Number(
document.getElementById("bajra").value
) || 0;

let besan =
Number(
document.getElementById("besan").value
) || 0;

let totalKg =
wheat +
jowar +
bajra +
besan;

let total =
totalKg * 50;

document.getElementById(
"total"
).innerHTML =
"Total Amount: ₹" + total;

};

window.placeOrder =
async function(){

let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let address =
document.getElementById("address").value;

let wheat =
Number(
document.getElementById("wheat").value
) || 0;

let jowar =
Number(
document.getElementById("jowar").value
) || 0;

let bajra =
Number(
document.getElementById("bajra").value
) || 0;

let besan =
Number(
document.getElementById("besan").value
) || 0;

if(
!name ||
!phone ||
!address
){

alert(
"Please Fill All Details"
);

return;

}

if(
wheat==0 &&
jowar==0 &&
bajra==0 &&
besan==0
){

alert(
"Add At Least One Product"
);

return;

}

let totalKg =
wheat +
jowar +
bajra +
besan;

let total =
totalKg * 50;

const orderId =
"ORD" + Date.now();

const items = [];

if(wheat>0){

items.push({
product:"Wheat Flour",
qty:wheat
});

}

if(jowar>0){

items.push({
product:"Jowar Flour",
qty:jowar
});

}

if(bajra>0){

items.push({
product:"Bajra Flour",
qty:bajra
});

}

if(besan>0){

items.push({
product:"Besan",
qty:besan
});

}

try{

await addDoc(
collection(db,"orders"),
{

orderId:orderId,

customerName:name,

phone:phone,

address:address,

items:items,

totalKg:totalKg,

totalAmount:total,

paymentMethod:"COD",

status:"Pending",

createdAt:
new Date().toISOString()

}
);

localStorage.setItem(
"lastPhone",
phone
);

let msg =

"🌾 Shadab Flour Mill Order%0A%0A" +

"Order ID: " +
orderId +
"%0A" +

"Customer: " +
name +
"%0A" +

"Phone: " +
phone +
"%0A%0A";

items.forEach((i)=>{

msg +=
i.product +
" - " +
i.qty +
" KG%0A";

});

msg +=

"%0AAddress: " +
address +

"%0A%0ATotal KG: " +
totalKg +

"%0AAmount: ₹" +
total;

window.open(

"https://wa.me/918459925150?text=" +
msg,

"_blank"

);

alert(

"Order Placed Successfully!\n\nOrder ID: " +
orderId

);

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("address").value="";

document.getElementById("wheat").value="";
document.getElementById("jowar").value="";
document.getElementById("bajra").value="";
document.getElementById("besan").value="";

document.getElementById(
"total"
).innerHTML =
"Total Amount: ₹0";

}catch(e){

alert(
"Error: " +
e.message
);

}

};

</script>

</body>
</html>
