<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadab Flour Mill Admin V2</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
padding:15px;
}

.login-box,
.admin-box{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#8B4513;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:8px;
}

.login-btn{
width:100%;
background:#8B4513;
color:white;
}

.order{
background:white;
padding:15px;
margin-top:15px;
border-radius:10px;
border-left:5px solid #8B4513;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.pending{
background:#ff9800;
color:white;
}

.delivery{
background:#2196F3;
color:white;
}

.delivered{
background:#4CAF50;
color:white;
}

.map-btn{
background:#673AB7;
color:white;
}

.status{
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div id="loginBox" class="login-box">

<h1>Admin Login</h1>

<input id="username" placeholder="Username">

<input id="password"
type="password"
placeholder="Password">

<button
class="login-btn"
onclick="login()">
Login
</button>

</div>

<div
id="adminPanel"
class="admin-box"
style="display:none;">

<h1>Shadab Flour Mill Orders</h1>

<div id="orders">
Loading...
</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",
authDomain: "planning-with-ai-90e6a.firebaseapp.com",
projectId: "planning-with-ai-90e6a",
storageBucket: "planning-with-ai-90e6a.firebasestorage.app",
messagingSenderId: "835817978059",
appId: "1:835817978059:web:441596d86a28628c3fc34e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.login = function(){

const u =
document.getElementById("username").value;

const p =
document.getElementById("password").value;

if(
u === "admin" &&
p === "Alpha123"
){

document.getElementById("loginBox").style.display="none";

document.getElementById("adminPanel").style.display="block";

loadOrders();

}else{

alert("Wrong Username or Password");

}

};

async function loadOrders(){

const ordersDiv =
document.getElementById("orders");

ordersDiv.innerHTML = "Loading Orders...";

const snap =
await getDocs(collection(db,"orders"));

ordersDiv.innerHTML = "";

snap.forEach((d)=>{

const data = d.data();

if(!data.customerName) return;

const status =
data.status || "Pending";

ordersDiv.innerHTML += `

<div class="order">

<h3>
${data.customerName}
</h3>

<p>
<b>Phone:</b>
${data.phone}
</p>

<p>
<b>Address:</b>
${data.address}
</p>

<p>
<b>Product:</b>
${data.product}
</p>

<p>
<b>Quantity:</b>
${data.quantityKg} KG
</p>

<p>
<b>Total:</b>
₹${data.totalAmount}
</p>

<p class="status">
Status:
${status}
</p>

<button
class="pending"
onclick="updateStatus('${d.id}','Pending')">
Pending
</button>

<button
class="delivery"
onclick="updateStatus('${d.id}','Out For Delivery')">
Out For Delivery
</button>

<button
class="delivered"
onclick="updateStatus('${d.id}','Delivered')">
Delivered
</button>

</div>

`;

});

}

window.updateStatus =
async function(id,status){

await updateDoc(
doc(db,"orders",id),
{
status:status
}
);

alert(
"Status Updated: " + status
);

location.reload();

};

</script>

</body>
</html>
