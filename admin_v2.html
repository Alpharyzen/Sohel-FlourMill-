<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Shadab Flour Mill Admin V3

</title>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

background:#000;

color:white;

font-family:'Montserrat',sans-serif;

padding:18px;

overflow-x:hidden;

}

/* HEADER */

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

}

.brand{

font-family:'Cinzel',serif;

font-size:24px;

letter-spacing:2px;

}

.subTitle{

font-size:12px;

color:#aaa;

margin-top:4px;

}

.menuBtn{

width:50px;
height:50px;

border:none;

border-radius:50%;

background:#111;

color:white;

font-size:22px;

cursor:pointer;

}

/* SIDEBAR */

.sidebar{

position:fixed;

top:0;
left:-300px;

width:280px;
height:100vh;

background:#111;

z-index:9999;

padding:25px;

transition:.35s;

border-right:1px solid rgba(255,255,255,.08);

}

.sidebar.open{

left:0;

}

.overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.7);

display:none;

z-index:9998;

}

.overlay.show{

display:block;

}

.menuTitle{

font-size:24px;

font-family:'Cinzel',serif;

margin-bottom:25px;

}

.menuItem{

padding:16px;

background:#1a1a1a;

border-radius:16px;

margin-bottom:12px;

font-weight:600;

cursor:pointer;

}

/* DASHBOARD */

.dashboard{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

margin-bottom:25px;

}

.statCard{

background:#111;

border-radius:20px;

padding:18px;

text-align:center;

}

.statNumber{

font-size:30px;

font-weight:800;

}

.statLabel{

font-size:12px;

color:#aaa;

margin-top:5px;

}

.pending{
border-left:4px solid #ffb300;
}

.confirmed{
border-left:4px solid #2196f3;
}

.delivery{
border-left:4px solid #ff7043;
}

.history{
border-left:4px solid #4caf50;
}

/* SECTION */

.sectionTitle{

font-family:'Cinzel',serif;

font-size:22px;

margin-bottom:15px;

}

.ordersContainer{

display:flex;

flex-direction:column;

gap:18px;

}

.orderCard{

background:#f5f5f5;

color:#000;

border-radius:35px;

padding:24px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

overflow:hidden;

}

.customerName{

font-size:24px;

font-weight:800;

margin-bottom:6px;

}

.orderId{

font-size:13px;

color:#666;

margin-bottom:15px;

}

.infoRow{

margin-bottom:10px;

font-size:15px;

line-height:1.6;

word-wrap:break-word;

overflow-wrap:break-word;

white-space:normal;

}

.label{

font-weight:700;

}

/* STATUS BADGES */

.statusBadge{

display:inline-block;

padding:8px 14px;

border-radius:20px;

font-size:13px;

font-weight:700;

margin-top:10px;

}

.pendingBadge{

background:#fff3cd;

color:#ff9800;

}

.confirmedBadge{

background:#e3f2fd;

color:#2196f3;

}

.deliveryBadge{

background:#fff3e0;

color:#ff5722;

}

.deliveredBadge{

background:#e8f5e9;

color:#4caf50;

}

.cancelledBadge{

background:#ffebee;

color:#f44336;

}

/* ACTION BUTTONS */

.actionRow{

display:flex;

gap:10px;

margin-top:18px;

margin-bottom:20px;

}

.actionBtn{

flex:1;

height:48px;

border:none;

border-radius:14px;

background:#111;

color:white;

font-size:18px;

cursor:pointer;

}

/* REAL SWIPE TRACK */

.swipeTrack{

position:relative;

width:100%;

height:64px;

background:#e4e4e4;

border-radius:32px;

overflow:hidden;

margin-top:15px;

}

.swipeLabel{

position:absolute;

left:0;
right:0;
top:50%;

transform:translateY(-50%);

text-align:center;

font-size:15px;

font-weight:800;

color:#111;

pointer-events:none;

}

.swipeThumb{

position:absolute;

left:0;
top:0;

width:64px;
height:64px;

border-radius:50%;

display:flex;

align-items:center;
justify-content:center;

font-size:22px;

font-weight:700;

color:white;

cursor:grab;

touch-action:none;

}

.swipePending{

background:#7cb342;

}

.swipeConfirmed{

background:#2196f3;

}

.swipeDelivery{

background:#ff7043;

}

.swipeDone{

background:#4caf50;

}

/* HISTORY */

.historyCard{

opacity:.85;

}

/* EMPTY */

.emptyText{

text-align:center;

padding:40px 0;

color:#888;

font-size:16px;

}

@media(max-width:900px){

.customerName{

font-size:21px;

}

.actionBtn{

font-size:16px;

}

.swipeTrack{

height:58px;

}

.swipeThumb{

width:58px;
height:58px;

}

}

</style>

</head>

<body>

<div
id="overlay"
class="overlay"
onclick="closeMenu()">

</div>

<div
id="sidebar"
class="sidebar">

<div class="menuTitle">

ADMIN MENU

</div>

<div
class="menuItem"
onclick="
location.href=
'history.html'
">

📦 History

</div>

<div
class="menuItem"
onclick="loadOrders()">

🔄 Refresh Orders

</div>

<div
class="menuItem"
onclick="logout()">

🚪 Logout

</div>

</div>

<div class="header">

<div>

<div class="brand">

SHADAB FLOUR MILL

</div>

<div class="subTitle">

Delivery Boy Panel

</div>

</div>

<button
class="menuBtn"
onclick="openMenu()">

☰

</button>

</div>

<div class="dashboard">

<div class="statCard pending">

<div
id="pendingCount"
class="statNumber">

0

</div>

<div class="statLabel">

Pending

</div>

</div>

<div class="statCard confirmed">

<div
id="confirmedCount"
class="statNumber">

0

</div>

<div class="statLabel">

Confirmed

</div>

</div>

<div class="statCard delivery">

<div
id="deliveryCount"
class="statNumber">

0

</div>

<div class="statLabel">

Out For Delivery

</div>

</div>



</div>

<div class="sectionTitle">

Current Orders

</div>

<div
id="currentOrders"
class="ordersContainer">

<div class="emptyText">

Loading Orders...

</div>

</div>

<br><br>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",

authDomain:
"planning-with-ai-90e6a.firebaseapp.com",

projectId:
"planning-with-ai-90e6a",

storageBucket:
"planning-with-ai-90e6a.firebasestorage.app",

messagingSenderId:
"835817978059",

appId:
"1:835817978059:web:441596d86a28628c3fc34e"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* MENU */

window.openMenu=
function(){

document
.getElementById("sidebar")
.classList.add("open");

document
.getElementById("overlay")
.classList.add("show");

};

window.closeMenu=
function(){

document
.getElementById("sidebar")
.classList.remove("open");

document
.getElementById("overlay")
.classList.remove("show");

};

window.scrollToHistory=
function(){

closeMenu();

document
.getElementById(
"historySection"
)
.scrollIntoView({

behavior:"smooth"

});

};

window.logout=
function(){

localStorage.clear();

location.reload();

};

/* LOAD ORDERS */

window.loadOrders =
async function(){

const currentDiv =
document.getElementById(
"currentOrders"
);

const historyDiv =
document.getElementById(
"historyOrders"
);

const snap =
await getDocs(
collection(
db,
"orders"
)
);

const orders=[];

snap.forEach((d)=>{

orders.push({

docId:d.id,

...d.data()

});

});

/* NEWEST FIRST */

orders.sort(
(a,b)=>
new Date(
b.createdAt
)
-
new Date(
a.createdAt
)
);

let currentHtml="";


let pendingCount=0;
let confirmedCount=0;
let deliveryCount=0;


orders.forEach((data)=>{

let moveToHistory=false;

/* DELIVERED 5 MIN */

if(
data.status=="Delivered"
&&
data.deliveredAt
){

const mins=

(
new Date()
-
new Date(
data.deliveredAt
)
)
/
1000
/
60;

if(mins>5){

moveToHistory=true;

}

}

/* CANCELLED 5 MIN */

if(
data.status=="Cancelled"
&&
data.cancelledAt
){

const mins=

(
new Date()
-
new Date(
data.cancelledAt
)
)
/
1000
/
60;

if(mins>5){

moveToHistory=true;

}

}



if(
data.status=="Pending"
){

pendingCount++;

}

else if(
data.status=="Confirmed"
){

confirmedCount++;

}

else if(
data.status==
"Out For Delivery"
){

deliveryCount++;

}

currentHtml +=
createOrderCard(
data
);

});

document.getElementById(
"pendingCount"
).innerText=
pendingCount;

document.getElementById(
"confirmedCount"
).innerText=
confirmedCount;

document.getElementById(
"deliveryCount"
).innerText=
deliveryCount;



currentDiv.innerHTML=

currentHtml ||

'<div class="emptyText">No Active Orders</div>';



};

/* =========================
   REAL SWIPE ENGINE
========================= */

let activeThumb=null;
let activeDocId=null;
let activeStatus=null;

let startX=0;
let currentX=0;

window.startSwipe =
function(
event,
docId,
status
){

activeThumb=
event.target;

activeDocId=
docId;

activeStatus=
status;

startX=
event.touches
?
event.touches[0].clientX
:
event.clientX;

document.addEventListener(
"mousemove",
moveSwipe
);

document.addEventListener(
"mouseup",
endSwipe
);

document.addEventListener(
"touchmove",
moveSwipe
);

document.addEventListener(
"touchend",
endSwipe
);

};

function moveSwipe(event){

if(!activeThumb)return;

currentX=
event.touches
?
event.touches[0].clientX
:
event.clientX;

let diff=
currentX-startX;

if(diff<0){
diff=0;
}

const track=
activeThumb.parentElement;

const maxMove=

track.offsetWidth
-
activeThumb.offsetWidth;

if(diff>maxMove){

diff=maxMove;

}

activeThumb.style.left=
diff+"px";

}

async function endSwipe(){

if(!activeThumb)return;

const track=
activeThumb.parentElement;

const maxMove=

track.offsetWidth
-
activeThumb.offsetWidth;

const currentLeft=

parseInt(
activeThumb.style.left
||0
);

if(
currentLeft
>
maxMove*0.75
){

let updateData={};

if(
activeStatus=="Pending"
){

updateData={

status:
"Confirmed",

confirmedAt:
new Date()
.toISOString()

};

}

else if(
activeStatus=="Confirmed"
){

updateData={

status:
"Out For Delivery",

outForDeliveryAt:
new Date()
.toISOString()

};

}

else if(
activeStatus==
"Out For Delivery"
){

updateData={

status:
"Delivered",

deliveredAt:
new Date()
.toISOString()

};

}

if(
Object.keys(
updateData
).length
){

await updateDoc(

doc(
db,
"orders",
activeDocId
),

updateData

);

}

}

activeThumb.style.left=
"0px";

activeThumb=null;

activeDocId=null;

activeStatus=null;

document.removeEventListener(
"mousemove",
moveSwipe
);

document.removeEventListener(
"mouseup",
endSwipe
);

document.removeEventListener(
"touchmove",
moveSwipe
);

document.removeEventListener(
"touchend",
endSwipe
);

}

/* =========================
   REALTIME
========================= */

window.onload=
function(){

loadOrders();

onSnapshot(

collection(
db,
"orders"
),

()=>{

loadOrders();

}

);

};

window.createOrderCard =
function(data){

let badgeClass=
"pendingBadge";

let badgeText=
"Pending";

let swipeClass=
"swipePending";

let swipeText=
"SWIPE TO CONFIRM";

if(
data.status=="Confirmed"
){

badgeClass=
"confirmedBadge";

badgeText=
"Confirmed";

swipeClass=
"swipeConfirmed";

swipeText=
"SWIPE TO OUT FOR DELIVERY";

}
else if(
data.status=="Delivered"
){

badgeClass=
"deliveredBadge";

badgeText=
"Delivered";

}
else if(
data.status==
"Out For Delivery"
){

badgeClass=
"deliveryBadge";

badgeText=
"Out For Delivery";

swipeClass=
"swipeDelivery";

swipeText=
"SWIPE TO DELIVERED";

}
else if(
data.status=="Cancelled"
){

badgeClass=
"cancelledBadge";

badgeText=
"Cancelled";

}
return `

<div class="orderCard">

<div class="customerName">

${data.name || "Customer"}

</div>

<div class="orderId">

Order ID:
${data.orderId || "-"}

</div>

<div class="infoRow">

<span class="label">

📞 Phone:

</span>

${data.phone || "-"}

</div>

<div class="infoRow">

<span class="label">

📍 Address:

</span>

${data.address || "-"}

</div>

<div class="infoRow">

<span class="label">

⚖ Total KG:

</span>

${data.totalKg || 0}

</div>

<div class="infoRow">

<span class="label">

💰 Amount:

</span>

₹${data.totalAmount || 0}

</div>

<div
class="
statusBadge
${badgeClass}
">

${badgeText}

</div>

<div class="actionRow">

<button
class="actionBtn"
onclick="
window.location.href=
'tel:${data.phone}'
">

📞

</button>

<button
class="actionBtn"
onclick="
window.open(
'https://wa.me/91${data.phone}'
)
">

💬

</button>

<button
class="actionBtn"
onclick="
window.open(
'https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.address || "")}'
)
">

📍

</button>

</div>

${
data.status!="Delivered"
&&
data.status!="Cancelled"

?

`

<div class="swipeTrack">

<div class="swipeLabel">

${swipeText}

</div>

<div
class="
swipeThumb
${swipeClass}
"

onmousedown="
window.startSwipe(
event,
'${data.docId}',
'${data.status}'
)
"

ontouchstart="
window.startSwipe(
event,
'${data.docId}',
'${data.status}'
)
">

➜

</div>

</div>

`

:

`

<div
class="
statusBadge
deliveredBadge
"
style="
margin-top:15px;
font-size:15px;
">

✓ COMPLETED

</div>

`

}

</div>

`;

};



/* AUTO REFRESH COUNTERS */

setInterval(
()=>{

loadOrders();

},
30000
);

</script>

</body>

</html>
