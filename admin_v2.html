<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadab Flour Mill Admin</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}

h1{
text-align:center;
color:#8B4513;
}

#loginBox,
#adminPanel{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
margin-right:5px;
}

.loginBtn{
background:#8B4513;
color:white;
width:100%;
}

.pending{
background:#ff9800;
color:white;
}

.confirmed{
background:#4CAF50;
color:white;
}

.delivery{
background:#2196F3;
color:white;
}

.delivered{
background:#009688;
color:white;
}

.stopBtn{
background:#f44336;
color:white;
}

.order{
background:white;
padding:15px;
margin-top:15px;
border-radius:10px;
border-left:5px solid #8B4513;
}
.topBar{
display:flex;
align-items:center;
gap:15px;
}

.menuBtn{
background:#8B4513;
color:white;
font-size:22px;
}

.sideMenu{
position:fixed;
top:0;
left:-260px;
width:250px;
height:100%;
background:white;
box-shadow:0 0 10px rgba(0,0,0,.3);
padding-top:60px;
transition:.3s;
z-index:999;
}

.sideMenu a{
display:block;
padding:15px 20px;
text-decoration:none;
color:black;
font-size:18px;
}

.sideMenu.show{
left:0;
}

</style>

</head>

<body>

<div id="loginBox">

<h1>Admin Login</h1>

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button
class="loginBtn"
onclick="login()">

Login

</button>

</div>

<div
id="adminPanel"
style="display:none">

<div
id="sideMenu"
class="sideMenu">

<a href="admin_v2.html">
📦 Orders
</a>

<a href="history.html">
📜 Delivery History
</a>

<a href="#"
onclick="logout()">
🚪 Logout
</a>

</div>

<div class="topBar">

<button
class="menuBtn"
onclick="openMenu()">
☰
</button>

<h1>
🌾 Shadab Flour Mill Orders
</h1>

</div>

<button
class="stopBtn"
onclick="
document.getElementById('alarm').pause();
document.getElementById('alarm').currentTime=0;
">

Stop Alarm

</button>

<audio
id="alarm"
src="alarm.mp3"
loop>
</audio>

<div id="orders"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",
authDomain: "planning-with-ai-90e6a.firebaseapp.com",
projectId: "planning-with-ai-90e6a",
storageBucket: "planning-with-ai-90e6a.firebasestorage.app",
messagingSenderId: "835817978059",
appId: "1:835817978059:web:441596d86a28628c3fc34e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let lastOrderTime = "";

if(
localStorage.getItem("adminLoggedIn")
==
"true"
){

document.getElementById(
"loginBox"
).style.display="none";

document.getElementById(
"adminPanel"
).style.display="block";

loadOrders();

checkNewOrders();

setInterval(
checkNewOrders,
5000
);

}

async function checkNewOrders(){

const snap =
await getDocs(
collection(db,"orders")
);

let newestTime = "";

snap.forEach((d)=>{

const data = d.data();

if(
data.createdAt &&
data.createdAt > newestTime
){
newestTime =
data.createdAt;
}

});

if(
lastOrderTime &&
newestTime &&
new Date(newestTime) >
new Date(lastOrderTime)
){

document
.getElementById("alarm")
.play();

setTimeout(()=>{

alert(
"🔔 New Order Received!"
);

document
.getElementById("alarm")
.pause();

document
.getElementById("alarm")
.currentTime = 0;

},1000);

}

lastOrderTime =
newestTime;

}

window.login = function(){

const u =
document.getElementById(
"username"
).value;

const p =
document.getElementById(
"password"
).value;

if(
u==="admin" &&
p==="Alpha123"
){

localStorage.setItem(
"adminLoggedIn",
"true"
);

document.getElementById(
"loginBox"
).style.display="none";

document.getElementById(
"adminPanel"
).style.display="block";

loadOrders();

checkNewOrders();

setInterval(
checkNewOrders,
5000
);

}else{

alert(
"Wrong Username Or Password"
);

}

};

async function loadOrders(){

const ordersDiv =
document.getElementById(
"orders"
);

ordersDiv.innerHTML="";

const snap =
await getDocs(
collection(db,"orders")
);

snap.forEach((d)=>{

const data=d.data();

const status =
data.status || "Pending";

let color =
"#ff9800";

if(status=="Confirmed")
color="#4CAF50";

if(status=="Out For Delivery")
color="#2196F3";

if(status=="Delivered")
color="#009688";

ordersDiv.innerHTML += `

<div class="order">

<h3>
${data.customerName}
</h3>

<p>
<b>Phone:</b>
${data.phone}
</p>

<p>
<b>Address:</b>
${data.address}
</p>

<p>
<b>Product:</b>
${data.product}
</p>

<p>
<b>Quantity:</b>
${data.quantityKg} KG
</p>

<p>
<b>Total:</b>
₹${data.totalAmount}
</p>

<p style="
color:${color};
font-weight:bold;
">
Status:
${status}
</p>

<button
class="pending"
onclick="
updateStatus(
'${d.id}',
'Pending'
)
">
Pending
</button>

<button
class="confirmed"
onclick="
updateStatus(
'${d.id}',
'Confirmed'
)
">
Confirmed
</button>

<button
class="delivery"
onclick="
updateStatus(
'${d.id}',
'Out For Delivery'
)
">
Out For Delivery
</button>

<button
class="delivered"
onclick="
updateStatus(
'${d.id}',
'Delivered'
)
">
Delivered
</button>

</div>

`;

});

}

window.updateStatus =
async function(id,status){

let updateData = {
status:status
};

if(
status=="Delivered"
){

updateData.deliveredAt =
new Date().toISOString();

}

await updateDoc(
doc(
db,
"orders",
id
),
updateData
);

loadOrders();

};

window.openMenu =
function(){

document
.getElementById(
"sideMenu"
)
.classList
.toggle(
"show"
);

};

window.logout =
function(){

localStorage.removeItem(
"adminLoggedIn"
);

location.reload();

};

</script>

</body>
</html>
