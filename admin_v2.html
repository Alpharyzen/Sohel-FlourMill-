<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Delivery Boy Panel

</title>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;

color:white;

font-family:'Montserrat',sans-serif;

padding:20px;

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}

.logo{

font-family:'Cinzel',serif;

font-size:24px;

letter-spacing:2px;

}

.subTitle{

font-size:13px;

color:#bdbdbd;

margin-top:4px;

}

.menuBtn{

width:45px;

height:45px;

border-radius:50%;

background:#111;

border:none;

color:white;

font-size:20px;

}

.dashboard{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

margin-bottom:25px;

}

.statCard{

background:#111;

border:1px solid rgba(255,255,255,.08);

border-radius:20px;

padding:18px;

text-align:center;

}

.statCount{

font-size:28px;

font-weight:800;

}

.statLabel{

font-size:13px;

margin-top:5px;

color:#bdbdbd;

}

.pending{
border-left:4px solid #ffb300;
}

.confirmed{
border-left:4px solid #42a5f5;
}

.delivery{
border-left:4px solid #ff7043;
}

.history{
border-left:4px solid #4caf50;
}

.searchBox{

background:#111;

border-radius:20px;

padding:15px;

margin-bottom:25px;

}

.searchInput{

width:100%;

height:55px;

border:none;

outline:none;

border-radius:14px;

padding:15px;

background:#1a1a1a;

color:white;

font-size:16px;

}

.sectionTitle{

font-family:'Cinzel',serif;

font-size:22px;

letter-spacing:1px;

margin-bottom:15px;

}

.ordersContainer{

display:flex;

flex-direction:column;

gap:18px;

}

.orderCard{

background:#f5f5f5;

color:#000;

border-radius:35px;

padding:25px;

overflow:hidden;

}

.customerName{

font-size:26px;

font-weight:800;

margin-bottom:8px;

}

.orderId{

font-size:14px;

color:#666;

margin-bottom:15px;

}

.infoRow{

margin-bottom:10px;

line-height:1.5;

font-size:15px;

}

.label{

font-weight:700;

}

.actionRow{

display:flex;

gap:10px;

margin-top:15px;

margin-bottom:15px;

}

.actionBtn{

flex:1;

height:45px;

border:none;

border-radius:14px;

font-size:18px;

cursor:pointer;

background:#111;

color:white;

}

.statusBadge{

display:inline-block;

padding:8px 14px;

border-radius:20px;

font-size:13px;

font-weight:700;

margin-top:10px;

}

.pendingBadge{

background:#fff3cd;

color:#ff9800;

}

.confirmedBadge{

background:#e3f2fd;

color:#2196f3;

}

.deliveryBadge{

background:#fff3e0;

color:#ff5722;

}

.deliveredBadge{

background:#e8f5e9;

color:#4caf50;

}

.cancelledBadge{

background:#ffebee;

color:#f44336;

}

.swipeContainer{

margin-top:20px;

}

.swipeBtn{

width:100%;

height:58px;

border:none;

border-radius:18px;

font-size:16px;

font-weight:800;

cursor:pointer;

color:white;

}

.swipePending{

background:#7cb342;

}

.swipeConfirmed{

background:#2196f3;

}

.swipeDelivery{

background:#ff7043;

}

.swipeDone{

background:#4caf50;

}

.historyCard{

opacity:.85;

}

.emptyText{

text-align:center;

color:#aaa;

padding:30px 0;

font-size:16px;

}

@media(max-width:900px){

.customerName{

font-size:22px;

}

.actionBtn{

font-size:16px;

}

}

</style>

</head>

<body>

<div class="header">

<div>

<div class="logo">

SHADAB FLOUR MILL

</div>

<div class="subTitle">

Delivery Boy Panel

</div>

</div>

<button class="menuBtn">

☰

</button>

</div>

<div class="dashboard">

<div class="statCard pending">

<div
class="statCount"
id="pendingCount">

0

</div>

<div class="statLabel">

Pending

</div>

</div>

<div class="statCard confirmed">

<div
class="statCount"
id="confirmedCount">

0

</div>

<div class="statLabel">

Confirmed

</div>

</div>

<div class="statCard delivery">

<div
class="statCount"
id="deliveryCount">

0

</div>

<div class="statLabel">

Out For Delivery

</div>

</div>

<div class="statCard history">

<div
class="statCount"
id="historyCount">

0

</div>

<div class="statLabel">

History

</div>

</div>

</div>

<div class="searchBox">

<input
id="searchInput"
class="searchInput"
placeholder="Search Phone / Order ID">

</div>

<div class="sectionTitle">

Current Orders

</div>

<div
id="currentOrders"
class="ordersContainer">

<div class="emptyText">

Loading Orders...

</div>

</div>

<br><br>

<div class="sectionTitle">

History

</div>

<div
id="historyOrders"
class="ordersContainer">

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",

authDomain:
"planning-with-ai-90e6a.firebaseapp.com",

projectId:
"planning-with-ai-90e6a",

storageBucket:
"planning-with-ai-90e6a.firebasestorage.app",

messagingSenderId:
"835817978059",

appId:
"1:835817978059:web:441596d86a28628c3fc34e"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.loadOrders =
async function(){

const currentDiv =
document.getElementById(
"currentOrders"
);

const historyDiv =
document.getElementById(
"historyOrders"
);

const snap =
await getDocs(
collection(
db,
"orders"
)
);

let currentHtml="";
let historyHtml="";

let pendingCount=0;
let confirmedCount=0;
let deliveryCount=0;
let historyCount=0;

snap.forEach((d)=>{

const data =
d.data();

const docId =
d.id;

let moveToHistory=false;

if(
data.status=="Delivered"
&&
data.deliveredAt
){

moveToHistory=

(
new Date()
-
new Date(data.deliveredAt)
)
/
1000
/
60
>
10;

}

if(
data.status=="Cancelled"
&&
data.cancelledAt
){

moveToHistory=

(
new Date()
-
new Date(data.cancelledAt)
)
/
1000
/
60
>
10;

}

if(moveToHistory){

historyCount++;

historyHtml += createHistoryCard(
data
);

return;

}

if(
data.status=="Pending"
){

pendingCount++;

}

else if(
data.status=="Confirmed"
){

confirmedCount++;

}

else if(
data.status==
"Out For Delivery"
){

deliveryCount++;

}

currentHtml +=
createOrderCard(
data,
docId
);

});

document.getElementById(
"pendingCount"
).innerText =
pendingCount;

document.getElementById(
"confirmedCount"
).innerText =
confirmedCount;

document.getElementById(
"deliveryCount"
).innerText =
deliveryCount;

document.getElementById(
"historyCount"
).innerText =
historyCount;

currentDiv.innerHTML =

currentHtml ||

'<div class="emptyText">No Active Orders</div>';

historyDiv.innerHTML =

historyHtml ||

'<div class="emptyText">No History</div>';

};

window.updateStatus =
async function(
docId,
currentStatus
){

let nextStatus={};

if(
currentStatus=="Pending"
){

nextStatus={

status:"Confirmed",

confirmedAt:
new Date().toISOString()

};

}

else if(
currentStatus=="Confirmed"
){

nextStatus={

status:"Out For Delivery",

outForDeliveryAt:
new Date().toISOString()

};

}

else if(
currentStatus==
"Out For Delivery"
){

nextStatus={

status:"Delivered",

deliveredAt:
new Date().toISOString()

};

}

await updateDoc(

doc(
db,
"orders",
docId
),

nextStatus

);

};

window.createOrderCard =
function(data,docId){

let badgeClass=
"pendingBadge";

let badgeText=
"Pending";

let btnClass=
"swipePending";

let btnText=
"➡ SWIPE TO CONFIRM";

if(
data.status=="Confirmed"
){

badgeClass=
"confirmedBadge";

badgeText=
"Confirmed";

btnClass=
"swipeConfirmed";

btnText=
"➡ SWIPE TO OUT FOR DELIVERY";

}

else if(
data.status==
"Out For Delivery"
){

badgeClass=
"deliveryBadge";

badgeText=
"Out For Delivery";

btnClass=
"swipeDelivery";

btnText=
"➡ SWIPE TO DELIVERED";

}

else if(
data.status=="Delivered"
){

badgeClass=
"deliveredBadge";

badgeText=
"Delivered";

btnClass=
"swipeDone";

btnText=
"✓ DELIVERED";

}

return `

<div class="orderCard">

<div class="customerName">

${data.name || "Customer"}

</div>

<div class="orderId">

Order ID:
${data.orderId}

</div>

<div class="infoRow">

<span class="label">

📞 Phone:

</span>

${data.phone || "-"}

</div>

<div class="infoRow">

<span class="label">

📍 Address:

</span>

${data.address || "-"}

</div>

<div class="infoRow">

<span class="label">

⚖ Total KG:

</span>

${data.totalKg || 0}

</div>

<div class="infoRow">

<span class="label">

💰 Amount:

</span>

₹${data.totalAmount || 0}

</div>

<div class="${badgeClass} statusBadge">

${badgeText}

</div>

<div class="actionRow">

<button
class="actionBtn"
onclick="
window.location.href=
'tel:${data.phone}'
">

📞

</button>

<button
class="actionBtn"
onclick="
window.open(
'https://wa.me/91${data.phone}'
)
">

💬

</button>

<button
class="actionBtn"
onclick="
window.open(
'https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.address || "")}'
)
">

📍

</button>

</div>

${
data.status!="Delivered"
&&
data.status!="Cancelled"

?

`

<div class="swipeContainer">

<button
class="swipeBtn ${btnClass}"
onclick="
updateStatus(
'${docId}',
'${data.status}'
)
">

${btnText}

</button>

</div>

`

:

""

}

</div>

`;

};

window.createHistoryCard =
function(data){

return `

<div class="orderCard historyCard">

<div class="customerName">

${data.name}

</div>

<div class="orderId">

${data.orderId}

</div>

<div class="infoRow">

📞 ${data.phone}

</div>

<div class="infoRow">

📍 ${data.address}

</div>

<div class="infoRow">

💰 ₹${data.totalAmount || 0}

</div>

<div
class="
statusBadge
${
data.status=="Cancelled"
?
"cancelledBadge"
:
"deliveredBadge"
}
">

${data.status}

</div>

</div>

`;

};

window.onload =
function(){

loadOrders();

onSnapshot(

collection(
db,
"orders"
),

()=>{

loadOrders();

}

);

};

</script>

</body>

</html>
