<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Shadab Flour Mill Admin

</title>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;

color:white;

font-family:'Montserrat',sans-serif;

padding:20px;

}

/* HEADER */

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

}

.brand{

font-family:'Cinzel',serif;

font-size:24px;

letter-spacing:2px;

}

.sub{

font-size:12px;

color:#aaa;

margin-top:4px;

}

.menuBtn{

width:48px;

height:48px;

border:none;

border-radius:50%;

background:#111;

color:white;

font-size:22px;

cursor:pointer;

}

/* SIDE MENU */

.sideMenu{

position:fixed;

top:0;
left:-280px;

width:260px;
height:100vh;

background:#111;

padding:25px;

z-index:9999;

transition:.35s;

border-right:1px solid rgba(255,255,255,.08);

}

.sideMenu.open{

left:0;

}

.sideTitle{

font-size:22px;

font-family:'Cinzel',serif;

margin-bottom:25px;

}

.menuItem{

display:block;

padding:15px;

margin-bottom:10px;

background:#1a1a1a;

border-radius:14px;

text-decoration:none;

color:white;

font-weight:600;

cursor:pointer;

}

.menuOverlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.65);

display:none;

z-index:9998;

}

.menuOverlay.show{

display:block;

}

/* DASHBOARD */

.dashboard{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

margin-bottom:25px;

}

.stat{

background:#111;

border-radius:20px;

padding:18px;

text-align:center;

border:1px solid rgba(255,255,255,.08);

}

.statNumber{

font-size:30px;

font-weight:800;

}

.statLabel{

font-size:12px;

margin-top:6px;

color:#aaa;

}

.pending{
border-left:4px solid #ffb300;
}

.confirmed{
border-left:4px solid #2196f3;
}

.delivery{
border-left:4px solid #ff7043;
}

.history{
border-left:4px solid #4caf50;
}

/* SECTION */

.sectionTitle{

font-family:'Cinzel',serif;

font-size:22px;

margin-bottom:15px;

letter-spacing:1px;

}

.ordersContainer{

display:flex;

flex-direction:column;

gap:18px;

}

.orderCard{

background:#f5f5f5;

color:#000;

border-radius:35px;

padding:25px;

overflow:hidden;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.customerName{

font-size:24px;

font-weight:800;

margin-bottom:8px;

}

.orderId{

font-size:14px;

color:#666;

margin-bottom:15px;

}

.infoRow{

margin-bottom:10px;

font-size:15px;

line-height:1.5;

}

.label{

font-weight:700;

}

.statusBadge{

display:inline-block;

padding:8px 14px;

border-radius:20px;

font-size:13px;

font-weight:700;

margin-top:10px;

}

.pendingBadge{

background:#fff3cd;

color:#ff9800;

}

.confirmedBadge{

background:#e3f2fd;

color:#2196f3;

}

.deliveryBadge{

background:#fff3e0;

color:#ff5722;

}

.deliveredBadge{

background:#e8f5e9;

color:#4caf50;

}

.cancelledBadge{

background:#ffebee;

color:#f44336;

}

/* ACTION BUTTONS */

.actionRow{

display:flex;

gap:10px;

margin-top:18px;

margin-bottom:20px;

}

.actionBtn{

flex:1;

height:48px;

border:none;

border-radius:14px;

background:#111;

color:white;

font-size:18px;

cursor:pointer;

}

/* REAL SWIPE */

.swipeWrap{

position:relative;

width:100%;

height:64px;

background:#e5e5e5;

border-radius:32px;

overflow:hidden;

margin-top:15px;

}

.swipeText{

position:absolute;

left:0;
right:0;
top:50%;

transform:translateY(-50%);

text-align:center;

font-size:15px;

font-weight:800;

color:#111;

pointer-events:none;

}

.swipeHandle{

position:absolute;

left:0;
top:0;

width:64px;
height:64px;

border-radius:50%;

display:flex;

align-items:center;
justify-content:center;

font-size:22px;

font-weight:700;

cursor:pointer;

user-select:none;

touch-action:none;

color:white;

}

.swipePending{

background:#7cb342;

}

.swipeConfirmed{

background:#2196f3;

}

.swipeDelivery{

background:#ff7043;

}

.swipeDone{

background:#4caf50;

}

/* HISTORY */

.historyCard{

opacity:.85;

}

/* EMPTY */

.emptyText{

text-align:center;

padding:35px 0;

color:#888;

font-size:16px;

}

@media(max-width:900px){

.customerName{

font-size:21px;

}

.actionBtn{

font-size:16px;

}

.swipeWrap{

height:58px;

}

.swipeHandle{

width:58px;
height:58px;

}

}

</style>

</head>

<body>

<div
id="menuOverlay"
class="menuOverlay"
onclick="closeMenu()">

</div>

<div
id="sideMenu"
class="sideMenu">

<div class="sideTitle">

ADMIN MENU

</div>

<div
class="menuItem"
onclick="scrollToHistory()">

📦 History

</div>

<div
class="menuItem"
onclick="loadOrders()">

🔄 Refresh Orders

</div>

<div
class="menuItem"
onclick="logout()">

🚪 Logout

</div>

</div>

<div class="header">

<div>

<div class="brand">

SHADAB FLOUR MILL

</div>

<div class="sub">

Delivery Boy Panel

</div>

</div>

<button
class="menuBtn"
onclick="openMenu()">

☰

</button>

</div>

<div class="dashboard">

<div class="stat pending">

<div
id="pendingCount"
class="statNumber">

0

</div>

<div class="statLabel">

Pending

</div>

</div>

<div class="stat confirmed">

<div
id="confirmedCount"
class="statNumber">

0

</div>

<div class="statLabel">

Confirmed

</div>

</div>

<div class="stat delivery">

<div
id="deliveryCount"
class="statNumber">

0

</div>

<div class="statLabel">

Out For Delivery

</div>

</div>

<div class="stat history">

<div
id="historyCount"
class="statNumber">

0

</div>

<div class="statLabel">

History

</div>

</div>

</div>

<div class="sectionTitle">

Current Orders

</div>

<div
id="currentOrders"
class="ordersContainer">

<div class="emptyText">

Loading Orders...

</div>

</div>

<br><br>

<div
id="historySection">

<div class="sectionTitle">

History

</div>

<div
id="historyOrders"
class="ordersContainer">

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyARITgbI7p5VAlwfwpbeZ653qzbsmLOpes",

authDomain:
"planning-with-ai-90e6a.firebaseapp.com",

projectId:
"planning-with-ai-90e6a",

storageBucket:
"planning-with-ai-90e6a.firebasestorage.app",

messagingSenderId:
"835817978059",

appId:
"1:835817978059:web:441596d86a28628c3fc34e"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* MENU */

window.openMenu=
function(){

document
.getElementById("sideMenu")
.classList.add("open");

document
.getElementById("menuOverlay")
.classList.add("show");

};

window.closeMenu=
function(){

document
.getElementById("sideMenu")
.classList.remove("open");

document
.getElementById("menuOverlay")
.classList.remove("show");

};

window.scrollToHistory=
function(){

closeMenu();

document
.getElementById(
"historySection"
)
.scrollIntoView({

behavior:"smooth"

});

};

window.logout=
function(){

localStorage.clear();

location.reload();

};

/* LOAD ORDERS */

window.loadOrders =
async function(){

const currentDiv =
document.getElementById(
"currentOrders"
);

const historyDiv =
document.getElementById(
"historyOrders"
);

const snap =
await getDocs(
collection(
db,
"orders"
)
);

const orders=[];

snap.forEach((d)=>{

orders.push({

docId:d.id,

...d.data()

});

});

/* LATEST ORDER TOP */

orders.sort(
(a,b)=>
new Date(b.createdAt)
-
new Date(a.createdAt)
);

let currentHtml="";
let historyHtml="";

let pendingCount=0;
let confirmedCount=0;
let deliveryCount=0;
let historyCount=0;

orders.forEach((data)=>{

let moveToHistory=false;

/* DELIVERED 10 MIN */

if(
data.status=="Delivered"
&&
data.deliveredAt
){

const mins=

(
new Date()
-
new Date(
data.deliveredAt
)
)
/
1000
/
60;

if(mins>10){

moveToHistory=true;

}

}

/* CANCELLED 10 MIN */

if(
data.status=="Cancelled"
&&
data.cancelledAt
){

const mins=

(
new Date()
-
new Date(
data.cancelledAt
)
)
/
1000
/
60;

if(mins>10){

moveToHistory=true;

}

}

if(moveToHistory){

historyCount++;

historyHtml +=
createHistoryCard(
data
);

return;

}

if(
data.status=="Pending"
){

pendingCount++;

}

else if(
data.status=="Confirmed"
){

confirmedCount++;

}

else if(
data.status==
"Out For Delivery"
){

deliveryCount++;

}

currentHtml +=
createOrderCard(
data
);

});

document.getElementById(
"pendingCount"
).innerText=
pendingCount;

document.getElementById(
"confirmedCount"
).innerText=
confirmedCount;

document.getElementById(
"deliveryCount"
).innerText=
deliveryCount;

document.getElementById(
"historyCount"
).innerText=
historyCount;

currentDiv.innerHTML=

currentHtml ||

'<div class="emptyText">No Active Orders</div>';

historyDiv.innerHTML=

historyHtml ||

'<div class="emptyText">No History</div>';

};

/* REAL SWIPE */

let activeHandle=null;
let activeDoc=null;
let activeStatus=null;
let startX=0;

window.startSwipe=
function(
e,
docId,
status
){

activeHandle=
e.target;

activeDoc=
docId;

activeStatus=
status;

startX=
e.touches
?
e.touches[0].clientX
:
e.clientX;

document.addEventListener(
"mousemove",
moveSwipe
);

document.addEventListener(
"mouseup",
endSwipe
);

document.addEventListener(
"touchmove",
moveSwipe
);

document.addEventListener(
"touchend",
endSwipe
);

};

function moveSwipe(e){

if(!activeHandle)return;

const x=
e.touches
?
e.touches[0].clientX
:
e.clientX;

let diff=
x-startX;

if(diff<0)diff=0;

if(diff>220)diff=220;

activeHandle.style.left=
diff+"px";

}

async function endSwipe(){

if(!activeHandle)return;

const pos=
parseInt(
activeHandle.style.left
)||0;

if(pos>180){

let updateData={};

if(
activeStatus=="Pending"
){

updateData={

status:"Confirmed",

confirmedAt:
new Date()
.toISOString()

};

}

else if(
activeStatus=="Confirmed"
){

updateData={

status:
"Out For Delivery",

outForDeliveryAt:
new Date()
.toISOString()

};

}

else if(
activeStatus==
"Out For Delivery"
){

updateData={

status:"Delivered",

deliveredAt:
new Date()
.toISOString()

};

}

await updateDoc(

doc(
db,
"orders",
activeDoc
),

updateData

);

}

activeHandle.style.left=
"0px";

activeHandle=null;

}

/* REALTIME */

window.onload=
function(){

loadOrders();

onSnapshot(

collection(
db,
"orders"
),

()=>{

loadOrders();

}

);

};

window.createOrderCard =
function(data){

let badgeClass=
"pendingBadge";

let badgeText=
"Pending";

let swipeClass=
"swipePending";

let swipeText=
"SWIPE TO CONFIRM";

if(
data.status=="Confirmed"
){

badgeClass=
"confirmedBadge";

badgeText=
"Confirmed";

swipeClass=
"swipeConfirmed";

swipeText=
"SWIPE TO OUT FOR DELIVERY";

}

else if(
data.status==
"Out For Delivery"
){

badgeClass=
"deliveryBadge";

badgeText=
"Out For Delivery";

swipeClass=
"swipeDelivery";

swipeText=
"SWIPE TO DELIVERED";

}

return `

<div class="orderCard">

<div class="customerName">

${data.name || "Customer"}

</div>

<div class="orderId">

Order ID:
${data.orderId || "-"}

</div>

<div class="infoRow">

<span class="label">

📞 Phone:

</span>

${data.phone || "-"}

</div>

<div class="infoRow">

<span class="label">

📍 Address:

</span>

${data.address || "-"}

</div>

<div class="infoRow">

<span class="label">

⚖ Total KG:

</span>

${data.totalKg || 0}

</div>

<div class="infoRow">

<span class="label">

💰 Amount:

</span>

₹${data.totalAmount || 0}

</div>

<div
class="
statusBadge
${badgeClass}
">

${badgeText}

</div>

<div class="actionRow">

<button
class="actionBtn"
onclick="
window.location.href=
'tel:${data.phone}'
">

📞

</button>

<button
class="actionBtn"
onclick="
window.open(
'https://wa.me/91${data.phone}'
)
">

💬

</button>

<button
class="actionBtn"
onclick="
window.open(
'https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.address || "")}'
)
">

📍

</button>

</div>

<div class="swipeWrap">

<div class="swipeText">

${swipeText}

</div>

<div
class="
swipeHandle
${swipeClass}
"

onmousedown="
startSwipe(
event,
'${data.docId}',
'${data.status}'
)
"

ontouchstart="
startSwipe(
event,
'${data.docId}',
'${data.status}'
)
">

➜

</div>

</div>

</div>

`;

};

window.createHistoryCard =
function(data){

return `

<div class="orderCard historyCard">

<div class="customerName">

${data.name || "Customer"}

</div>

<div class="orderId">

${data.orderId || "-"}

</div>

<div class="infoRow">

📞
${data.phone || "-"}

</div>

<div class="infoRow">

📍
${data.address || "-"}

</div>

<div class="infoRow">

💰
₹${data.totalAmount || 0}

</div>

<div
class="
statusBadge
${
data.status=="Cancelled"
?
"cancelledBadge"
:
"deliveredBadge"
}
">

${data.status}

</div>

</div>

`;

};

</script>

</body>

</html>
